name: Python CI for RPS Game

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Repository ka code runner par download karna
    - name: Checkout code
      uses: actions/checkout@v7

    # 2. Python environment setup karna
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Dependencies install karna (agar requirements.txt hai toh)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Syntax check / Python script run karke test karna
    - name: Lint and check code
      run: |
        # Yeh check karega ki code mein koi syntax error toh nahi hai
        python -m py_compile main.py